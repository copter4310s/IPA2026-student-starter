---
- name: Apply desired Loopback interface state
  hosts: target
  gather_facts: false
  tasks:
    - name: Configure complete Loopback state
      cisco.ios.ios_config:
        defaults: true
        replace: block
        parents: "interface {{ interface_name }}"
        lines:
          - "description {{ description }}"
          - "ip address {{ ipv4_address }} {{ netmask }}"
          - "{{ 'shutdown' if shutdown else 'no shutdown' }}"
